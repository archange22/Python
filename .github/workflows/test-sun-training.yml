name: SUN training data checks

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/test-sun-training.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/test-sun-training.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile SUN training and evaluation scripts
        run: |
          python -m py_compile training/prepare_sft_dataset.py
          python -m py_compile training/evaluate_dataset.py
          python -m py_compile training/evaluate_responses.py
          python -m py_compile training/train_sft.py
          python -m py_compile training/merge_sun_lora.py
          python -m py_compile training/evaluate_sun_model.py
      - name: Test dataset preparation, topic splits and benchmark
        run: python -m unittest discover -s training/tests -v
      - name: Prepare the original SUN dataset
        run: python training/prepare_sft_dataset.py --input training/data/seed.jsonl --output-dir /tmp/sun-prepared
      - name: Audit data splits
        run: python training/evaluate_dataset.py --data-dir /tmp/sun-prepared
      - name: Validate corpus coverage and provenance fields
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path("training/data/seed.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(rows) == 126, f"Expected 126 examples, found {len(rows)}"
          assert all(row.get("license_verified") is True for row in rows)
          assert all(row.get("privacy_reviewed") is True for row in rows)
          assert all(row.get("quality_status") == "approved" for row in rows)
          assert all(row.get("rights_status") in {"project_original", "explicit_permission", "open_license_verified"} for row in rows)
          topics = Counter(row.get("topic", "general") for row in rows)
          languages = Counter(row["language"] for row in rows)
          required = {"mathematics", "physics", "chemistry", "python", "javascript", "java", "c", "html-css", "sql"}
          assert required.issubset(topics), f"Missing subjects: {required - set(topics)}"
          assert {"fr", "en"}.issubset(languages)
          print("Validated", len(rows), "original examples")
          print("Domains:", dict(topics))
          print("Languages:", dict(languages))
          PY
