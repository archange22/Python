name: SUN training data checks

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/test-sun-training.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/test-sun-training.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test preparation and evaluation pipeline
        run: python -m unittest discover -s training/tests -v
      - name: Prepare the original sample dataset
        run: python training/prepare_sft_dataset.py --input training/data/seed.jsonl --output-dir /tmp/sun-prepared
      - name: Audit the prepared dataset
        run: python training/evaluate_dataset.py --data-dir /tmp/sun-prepared
      - name: Validate SUN Neural trainer and synthetic corpus
        run: |
          python -m py_compile training/train_sun_neural.py
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          path = Path("training/neural/intents.jsonl.gz.b64")
          rows = [json.loads(line) for line in gzip.decompress(base64.b64decode(path.read_text().strip())).decode().splitlines() if line.strip()]
          labels = {"greeting", "python_variable_equal", "python_control_flow", "python_function", "python_collections", "python_input_files", "python_error", "python_beginner", "unknown"}
          assert len(rows) == 260, f"Expected 260 corpus rows, got {len(rows)}"
          assert all(isinstance(row, list) and len(row) == 2 and row[0] in labels and isinstance(row[1], str) and row[1].strip() for row in rows)
          print(f"Validated {len(rows)} original synthetic SUN Neural examples.")
          PY
