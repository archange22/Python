name: Test Sun Brain

on:
  push:
    branches: [main]
    paths:
      - "sun-brain.js"
      - "sun-ia.js"
      - "sun-ia.css"
      - "app.js"
      - "index.html"
      - "tests/sun-ui.test.cjs"
      - "tests/sun-brain.test.cjs"
      - "courses/**/*.md"
      - "knowledge/**/*.md"
      - "knowledge/**/*.json"
      - "scripts/**/*.py"
      - "tests/test_pdf_ingestion.py"
      - ".github/workflows/build-course-pdfs.yml"
      - "sw.js"
      - "pdf/lecon-0[234].md"
      - ".github/workflows/test-sun-brain.yml"
  pull_request:
    paths:
      - "sun-brain.js"
      - "sun-ia.js"
      - "sun-ia.css"
      - "app.js"
      - "index.html"
      - "tests/sun-ui.test.cjs"
      - "tests/sun-brain.test.cjs"
      - "courses/**/*.md"
      - "knowledge/**/*.md"
      - "knowledge/**/*.json"
      - "knowledge/sources/**/*.b64"
      - "scripts/**/*.py"
      - "tests/test_pdf_ingestion.py"
      - ".github/workflows/build-course-pdfs.yml"
      - "sw.js"
      - "pdf/lecon-0[234].md"
      - ".github/workflows/test-sun-brain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install beautifulsoup4 weasyprint pypdf
      - name: Build and verify Sun discussion PDF 0.0.2
        run: python scripts/build_sun_discussion_pdf.py
      - name: Run PDF ingestion tests
        run: python -m unittest discover -s tests -p "test_pdf_ingestion.py"
      - name: Check frontend JavaScript syntax
        run: |
          node --check sun-brain.js
          node --check sun-ia.js
          node --check app.js
      - name: Run Sun Brain and interface regression tests
        run: node --test tests/sun-brain.test.cjs tests/sun-ui.test.cjs
