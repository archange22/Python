name: Build PythonSchool lesson PDF

on:
  push:
    branches: [main]
    paths:
      - "pdf/lecon-01-content.md.gz.b64"
      - "scripts/build_python_lesson.py"
      - ".github/workflows/build-lesson-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-pip python3-venv
          python3 -m venv .venv
          .venv/bin/pip install beautifulsoup4 weasyprint
      - name: Generate lesson PDF
        run: .venv/bin/python scripts/build_python_lesson.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/lecon-01-python-school.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date"
          else
            git commit -m "Génère le PDF PythonSchool leçon 01 [skip ci]"
            git pull --rebase origin main
            git push
          fi
