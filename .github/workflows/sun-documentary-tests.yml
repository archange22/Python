name: Sun documentary ingestion tests

on:
  pull_request:
    paths:
      - "scripts/ingest_pdf_knowledge.py"
      - "tests/test_pdf_ingestion.py"
      - "README.md"
      - ".github/workflows/sun-documentary-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_pdf_knowledge.py"
      - "tests/test_pdf_ingestion.py"
      - "README.md"
      - ".github/workflows/sun-documentary-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without out-of-scope blobs
        env:
          PR_NUMBER: \${{ github.event.pull_request.number }}
        run: |
          git init .
          git remote add origin "https://github.com/\${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            '/*' \
            '!/knowledge/discussion-global-v0.0.2.md' \
            '!/knowledge/imported/discussion-global-v0.0.2.md' \
            '!/knowledge/pdfs/sun-discussion-global-v0.0.2.pdf'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --filter=blob:none --no-tags --depth=1 origin "refs/pull/\${PR_NUMBER}/merge"
          else
            git fetch --filter=blob:none --no-tags --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install pypdf

      - name: Run PDF ingestion tests
        run: python -m unittest discover -s tests -p "test_pdf_ingestion.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Sun regression tests
        run: node --test tests/sun-brain.test.cjs tests/sun-ui.test.cjs
